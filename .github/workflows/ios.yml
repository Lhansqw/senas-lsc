# Compila la app de iPhone y la del Apple Watch en macOS, sin firmar.
# Sirve para comprobar el código Swift y el XCFramework de Kotlin sin tener una Mac.
name: iOS y Apple Watch

on:
  workflow_dispatch:
  pull_request:
    paths: ["ios/**", "shared/**", "core/model/**", "sequence/**", "recognizer/api/**", "interpreter/api/**", "interpreter/rules/**", "vision/comun/**"]
  push:
    branches: [main]
    paths: ["ios/**", "shared/**", "core/model/**", "sequence/**", "recognizer/api/**", "interpreter/api/**", "interpreter/rules/**", "vision/comun/**"]

jobs:
  compilar:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de la lógica compartida
        run: ./gradlew :shared:allTests --console=plain

      - name: Herramientas
        run: brew install xcodegen

      - name: Preparar el proyecto
        run: sh ios/preparar.sh

      - name: Compilar para el simulador
        working-directory: ios
        run: >
          xcodebuild -workspace SenasLSC.xcworkspace -scheme SenasLSC
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
