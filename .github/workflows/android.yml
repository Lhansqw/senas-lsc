# Pruebas unitarias y versión de producción de Android (con R8), sin firmar.
# Sirve para detectar antes de publicar las roturas de R8 o de las reglas de proguard-rules.pro.
name: Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew test --console=plain

      - name: Versión de producción (R8, sin firmar)
        run: ./gradlew :app:assembleRelease --console=plain
