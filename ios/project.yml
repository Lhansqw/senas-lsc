# Proyecto Xcode de Señas LSC para iPhone y Apple Watch, descrito para XcodeGen.
# El .xcodeproj no se guarda en git: se genera en la Mac (ver ios/README.md):
#   cd ios && ./preparar.sh && open SenasLSC.xcworkspace
name: SenasLSC
options:
  bundleIdPrefix: com.lhansqw.senaslsc
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"    # modo de lenguaje Swift 5 (Xcode 16 usa el compilador 6)
    DEVELOPMENT_TEAM: ""   # pon aquí tu Team ID de Apple Developer para instalar en dispositivos

targets:
  SenasLSC:
    type: application
    platform: iOS
    sources:
      - path: SenasLSC
      - path: Comun
      # Modelo de señas: el mismo archivo que usa Android.
      - path: ../recognizer/litert/src/main/assets/modelo.json
        buildPhase: resources
        optional: true   # no está en git; sin él la app avisa de que no hay modelo
      - path: ../recognizer/litert/src/main/assets/reconocedor_lsc.tflite
        buildPhase: resources
        optional: true   # no está en git; sin él la app avisa de que no hay modelo
      # Modelos de MediaPipe para iOS (los descarga preparar.sh).
      - path: Modelos
        buildPhase: resources
        optional: true
      - path: ../app/src/main/res/font/atkinson_hyperlegible_next.ttf
        buildPhase: resources
    dependencies:
      - target: SenasLSCWatch
      - framework: ../shared/build/XCFrameworks/release/SenasShared.xcframework
    info:
      path: SenasLSC/Info.plist
      properties:
        CFBundleDisplayName: Señas LSC
        CFBundleDevelopmentRegion: es
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: >-
          La cámara frontal se usa para reconocer tus señas. Las imágenes se analizan en el
          iPhone y nunca se guardan ni se envían.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lhansqw.senaslsc
        TARGETED_DEVICE_FAMILY: "1"
        # El XCFramework es estático y usa la biblioteca de C++ de Kotlin/Native.
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
    preBuildScripts:
      - name: Compilar SenasShared (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:assembleSenasSharedReleaseXCFramework --console=plain

  SenasLSCWatch:
    type: application
    platform: watchOS
    sources:
      - path: SenasLSCWatch
      - path: Comun
      - path: ../app/src/main/res/font/atkinson_hyperlegible_next.ttf
        buildPhase: resources
    info:
      path: SenasLSCWatch/Info.plist
      properties:
        CFBundleDisplayName: Señas LSC
        CFBundleDevelopmentRegion: es
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.lhansqw.senaslsc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lhansqw.senaslsc.watchkitapp

schemes:
  SenasLSC:
    build:
      targets:
        SenasLSC: all
        SenasLSCWatch: all
    run:
      config: Debug
